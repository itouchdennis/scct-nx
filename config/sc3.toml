# Recompiler input for sc3.xbe (Splinter Cell: Chaos Theory, original Xbox, title 55530038): the campaign, which
# the disc's default.xbe (a launcher) starts. The XDK library functions and data were found by their code in
# Double Agent's default.xbe (the same XDK 1.0.5849), matched by signature and by their neighbours.
includes = ["xdk_symbols_sc3.toml"]

[xbe]
path = "assets/sc3.xbe"
out = "generated/game"
library = "SCCT.dll"  # <exe>.dll, which the executable delay loads
partitions = 128
code_sections = [".text", "XNET", "XONLINE", "D3D", "D3DX", "XGRPH", "DSOUND", "XPP",
    "BINK", "BINK32", "BINK32A", "BINK16", "BINK4444", "BINK5551", "BINKYUY2",
    "BINK16MX", "BINK16X2", "BINK16M", "BINK32MX", "BINK32X2", "BINK32M"]

[functions]

